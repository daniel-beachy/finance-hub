<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Finance Hub: a personal finance dashboard that runs on your own machine." />
    <title>Finance Hub</title>
    <script>
      // Set the theme before first paint so the page never flashes.
      (() => {
        let theme = null;
        try { theme = localStorage.getItem("fh-theme"); } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
